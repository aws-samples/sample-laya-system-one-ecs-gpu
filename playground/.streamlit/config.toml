[server]
# Loopback only: the SSM port-forward delivers traffic to localhost inside the task.
address = "127.0.0.1"
port = 8080
headless = true
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 1

[client]
showErrorDetails = false
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
